<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Uñas de Autor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="card auth-card">
    <p class="eyebrow">Panel privado</p>
    <h1>Bienvenida de vuelta</h1>
    <p class="sub">Entra para ver tu agenda y tus citas.</p>

    <div id="errorMsg" class="error-msg"></div>

    <div class="field">
      <label for="inputEmail">Correo</label>
      <input type="email" id="inputEmail" placeholder="tucorreo@ejemplo.com">
    </div>
    <div class="field">
      <label for="inputPassword">Contraseña</label>
      <input type="password" id="inputPassword" placeholder="••••••••">
    </div>

    <button class="btn btn-primary btn-block" id="btnLogin" onclick="iniciarSesion()">Entrar</button>

    <p style="margin-top:18px; font-size:13px; text-align:center;">
      ¿Primera vez configurando el negocio? <a href="setup.html" class="signature">Crear cuenta</a>
    </p>
    <p style="margin-top:10px; font-size:13px; text-align:center;">
      <a href="index.html" style="color:var(--ink-soft);">← Volver al sitio</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
async function iniciarSesion() {
  const email = document.getElementById('inputEmail').value.trim();
  const pass = document.getElementById('inputPassword').value;
  const errBox = document.getElementById('errorMsg');
  const btn = document.getElementById('btnLogin');
  errBox.classList.remove('show');

  if (!email || !pass) {
    errBox.textContent = 'Escribe tu correo y contraseña.';
    errBox.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    window.location.href = 'admin.html';
  } catch (err) {
    errBox.textContent = 'Correo o contraseña incorrectos.';
    errBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

document.getElementById('inputPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') iniciarSesion();
});

auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'admin.html';
});
</script>
</body>
</html>
